<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Halloween</title>
<meta name="theme-color" content="#241431">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #241431;
    --frame: #3a2250;
    --bone: #f2e8da;
    --pumpkin: #ff7a1a;
    --ink: #241431;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--night);
    color: var(--bone);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(2rem, 9vw, 2.75rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .frame {
    width: 100%;
    background: var(--frame);
    padding: 10px;
    border-radius: 18px;
  }
  .frame img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
  }
  .fallback {
    display: none;
    margin: 0;
    padding: 28px 12px;
    color: var(--bone);
    font-weight: 500;
  }
  .cta {
    display: block;
    width: 100%;
    padding: 16px 20px;
    background: var(--pumpkin);
    color: var(--ink);
    font: inherit;
    font-weight: 800;
    font-size: 1.1rem;
    text-decoration: none;
    border-radius: 14px;
  }
  .cta:hover { background: #ff8f3d; }
  .cta:focus-visible { outline: 3px solid var(--bone); outline-offset: 3px; }
  .cta:active { transform: translateY(1px); }

  /* Layar pembuka: sentuhan pertama membuka izin suara di browser */
  .gate {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--night);
    color: var(--bone);
    font: inherit;
    font-weight: 800;
    font-size: clamp(1.6rem, 8vw, 2.4rem);
    letter-spacing: -0.01em;
    cursor: pointer;
    padding: 24px;
    z-index: 10;
  }
  .gate span {
    display: inline-block;
    padding: 18px 26px;
    background: var(--pumpkin);
    color: var(--ink);
    border-radius: 16px;
  }
  .gate:focus-visible { outline: 3px solid var(--bone); outline-offset: -8px; }
</style>
</head>
<body>

<button class="gate" id="gate" type="button"><span>Ketuk untuk membuka</span></button>

<main id="stage" hidden>
  <h1>Happy Halloween</h1>

  <div class="frame">
    <img id="gif" alt="GIF Halloween">
    <p class="fallback" id="fallback">GIF-nya gagal dimuat. Tombol di bawah tetap berfungsi.</p>
  </div>

  <a class="cta" href="https://www.instagram.com/jasminor.id/">Buka Instagram @jasminor.id</a>
</main>

<audio id="snd" src="sound.mp3" preload="auto"></audio>

<script>
  // ============================================================
  // DAFTAR GIF. Setiap kali scan, salah satu dipilih secara acak.
  // Cara menambah: tulis satu baris baru, diapit tanda kutip, lalu
  // akhiri dengan koma. Bisa nama file di repo, bisa link Giphy.
  // Nama file harus sama persis (huruf kecil/besar dibedakan).
  // ============================================================
  var GIFS = [
    'https://media.giphy.com/media/Gj2nHXUa85FXKngX46/giphy.gif',
    // 'gif1.gif',
    // 'gif2.gif',
    // 'gif3.gif',
  ];

  var gate = document.getElementById('gate');
  var stage = document.getElementById('stage');
  var gif = document.getElementById('gif');
  var fallback = document.getElementById('fallback');
  var snd = document.getElementById('snd');

  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  // Urutan acak. Kalau satu GIF gagal dimuat, otomatis coba GIF berikutnya.
  var queue = shuffle(GIFS.slice());

  function showNext() {
    if (queue.length === 0) {
      gif.style.display = 'none';
      fallback.style.display = 'block';
      return;
    }
    gif.src = queue.shift();
  }

  gif.addEventListener('error', showNext);

  gate.addEventListener('click', function () {
    gate.hidden = true;
    stage.hidden = false;
    // GIF dimuat setelah ketukan supaya animasinya mulai bersamaan dengan suara
    showNext();
    try {
      var p = snd.play();
      if (p && p.catch) { p.catch(function () {}); }
    } catch (e) {}
  }, { once: true });
</script>
</body>
</html>
